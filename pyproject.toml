[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "halogal"
version = "0.1.0"
description = "UV Luminosity Function and Halo Occupation Distribution modeling for high-redshift galaxies"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["astronomy", "cosmology", "galaxies", "luminosity-function", "halo-model"]
requires-python = ">=3.8"
dependencies = [
    # numpy is capped below 2.0: camb's BBN predictor (pulled in via
    # halomod -> hmf -> camb) returns a NumPy array for YHe, and numpy>=2
    # raises "only 0-dimensional arrays can be converted to Python scalars"
    # in camb.set_cosmology. Relax once a numpy>=2-safe camb (>=1.6.6) is the
    # norm. See environment.yml for the recommended conda install.
    "numpy>=1.20,<2",
    "scipy>=1.7.0",
    "astropy>=5.0.0",
    "colossus>=1.3.0",
    "halomod>=1.4.0",
]

[project.optional-dependencies]
inference = [
    "emcee>=3.1",
    "dynesty>=2.0",
    "corner>=2.2",
    "schwimmbad>=0.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/mShuntov/uvlf-hod"
Documentation = " https://uvlf-hod.readthedocs.io/en/latest/#"
Repository = "https://github.com/mShuntov/uvlf-hod"
"Bug Tracker" = "https://github.com/mShuntov/uvlf-hod/issues"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests that run a sampler or build a halomod model (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["halogal"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
